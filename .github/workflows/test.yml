name: NePay Tests

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'

jobs:
  # ── Unit Tests (runs on every PR, ~30s) ────────────────────────────────────
  unit-tests:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test
        working-directory: apps/web

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-coverage
          path: apps/web/coverage/

  # ── E2E Tests (runs on merge to main + schedule) ─────────────────────────────
  e2e-tests:
    name: E2E Tests (Cypress)
    runs-on: ubuntu-latest
    # Only run on merge to main or 6-hour schedule, not on every PR
    if: github.event_name != 'pull_request' || github.ref == 'refs/heads/main'
    
    # We need permissions to write to gh-pages branch
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Write cypress.env.json
        run: |
          echo '{
            "TEST_EMAIL": "${{ secrets.CYPRESS_TEST_EMAIL }}",
            "TEST_PASSWORD": "${{ secrets.CYPRESS_TEST_PASSWORD }}",
            "API_URL": "${{ secrets.CYPRESS_API_URL }}"
          }' > apps/web/cypress.env.json

      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: apps/web
          browser: chrome
          record: false
        env:
          CYPRESS_BASE_URL: https://staging-nepay.vercel.app

      - name: Merge Mochawesome reports
        if: always()
        run: |
          cd apps/web
          npx mochawesome-merge cypress/reports/*.json -o cypress/reports/combined.json
          npx marge cypress/reports/combined.json --reportDir cypress/reports --inline

      - name: Upload Mochawesome HTML report as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: |
            apps/web/cypress/reports/
            apps/web/cypress/screenshots/
            apps/web/cypress/videos/

      - name: Deploy Dashboard to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/web/cypress/reports
          keep_files: false

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🤖 *NePay Test Automation* 🤖
            
            Status: ${{ job.status == 'success' && '✅ All Passed!' || '❌ Failed Tests Found' }}
            
            🌐 *View Live Dashboard:*
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/combined.html
